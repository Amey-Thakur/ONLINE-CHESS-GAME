<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Chess Game - Social Preview</title>
<!--
  Renders the 1280x640 social preview. Uses the same Wikipedia piece sprites and
  the same #f0d9b5 / #b58863 board colours the game itself renders with.
-->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;overflow:hidden;background:#14110d}
.card:before{content:"";position:absolute;inset:0;
  background:radial-gradient(760px 620px at 74% 46%,rgba(240,217,181,.20),transparent 62%)}
.board{position:absolute;right:82px;top:58px;width:524px;height:524px;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  box-shadow:0 40px 90px rgba(0,0,0,.72),0 0 0 10px #2a2018,0 0 0 12px #5b452e}
.sq{position:relative}
.sq.l{background:#f0d9b5}.sq.d{background:#b58863}
.sq img{position:absolute;inset:6%;width:88%;height:88%}
.left{position:absolute;left:80px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:14px;font-weight:700;letter-spacing:.26em;color:#c9a227}
.title{margin-top:22px;font-size:78px;font-weight:800;line-height:.98;letter-spacing:-.025em;color:#f7f1e6}
.rule{margin:28px 0;width:96px;height:4px;background:#c9a227}
.meta{font-size:17px;font-weight:700;letter-spacing:.10em;color:#b9a98f;line-height:1.85}
.meta b{color:#f0d9b5;font-weight:700}
.by{margin-top:30px;font-size:20px;font-weight:700;color:#f7f1e6}
.by span{display:block;font-size:13px;font-weight:600;letter-spacing:.18em;color:#8e8069;margin-bottom:8px}
.turn{margin-top:28px;align-self:flex-start;display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:999px;background:rgba(201,162,39,.13);border:1px solid rgba(201,162,39,.42);font-size:15px;font-weight:700;color:#f0d9b5;letter-spacing:.08em}
.dot{width:11px;height:11px;border-radius:50%;background:#5cd18a;box-shadow:0 0 12px #5cd18a}
</style>
<div class="card">
  <div class="board"><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bR.png"></div><div class="sq d"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bB.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/bQ.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bK.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/bB.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bN.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/bR.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/bP.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bP.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/bP.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bP.png"></div><div class="sq d"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wN.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/bP.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bP.png"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bN.png"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/bP.png"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wB.png"></div><div class="sq d"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq d"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/bB.png"></div><div class="sq d"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq l"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/wP.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/wR.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wN.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/wB.png"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wQ.png"></div><div class="sq d"><img src="Source Code/img/chesspieces/wikipedia/wK.png"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"><img src="Source Code/img/chesspieces/wikipedia/wR.png"></div></div>
  <div class="left">
    <div class="kicker">MINI PROJECT &middot; SEMESTER VIII &middot; CSL801</div>
    <div class="title">Online<br>Chess Game</div>
    <div class="rule"></div>
    <div class="meta">Real-time multiplayer with in-game chat<br><b>Node.js &middot; Express &middot; Socket.IO &middot; chessboard.js</b></div>
    <div class="by"><span>DESIGNED &amp; DEVELOPED BY</span>Amey Thakur &middot; Mega Satish</div>
    <div class="turn"><span class="dot"></span>2 PLAYERS CONNECTED</div>
  </div>
</div>
</body>
</html>
